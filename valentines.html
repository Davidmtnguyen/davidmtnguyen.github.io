<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="valentines.css">
    <script type="module" src="valentines.js" defer></script>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    
    <div id="dimOverlay" class="dim-overlay hidden"></div>
    
    <div id="content" class="content hidden">
        <svg id="heart" class="heart" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50,90 C25,75 10,60 10,45 C10,30 20,20 30,20 C40,20 50,30 50,30 C50,30 60,20 70,20 C80,20 90,30 90,45 C90,60 75,75 50,90 Z" fill="#ff1493" stroke="#ff1493" stroke-width="1"/>
        </svg>
        
        <h1 id="question">Will you be my Valentine?</h1>
        
        <div id="buttonContainer" class="button-container">
            <button id="yesBtn" class="large-btn yes-btn">Yes</button>
            <button id="noBtn" class="large-btn no-btn">No</button>
        </div>
    </div>

    <div id="celebrationText" class="celebration-text-display hidden"></div>

    <div id="celebrateAgainContainer" class="celebrate-again-container hidden">
        <button id="celebrateAgainBtn" class="large-btn celebrate-btn">Celebrate Again!</button>
    </div>

    <div id="celebrationContainer" class="hidden">
        <!-- Fireworks will be rendered on canvas -->
    </div>
</body>
</html>
